
workflows:
  android-workflow:
    name: ALL VIDEO DOWNLOADER APK
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Create Flutter platform files
        script: |
          flutter create --platforms=android,web .

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  web-workflow:
    name: ALL VIDEO DOWNLOADER WEB
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Create Flutter platform files
        script: |
          flutter create --platforms=android,web .

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Build Website
        script: |
          flutter build web --release

    artifacts:
      - build/web/**
      
